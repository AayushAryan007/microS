<!DOCTYPE html>
<html>
  <head>
    <title>Inventory</title>
    <style>
      table,
      th,
      td {
        border: 1px solid #333;
        border-collapse: collapse;
        padding: 6px;
      }
      form {
        margin-bottom: 1em;
      }
      .copy-btn {
        margin-left: 6px;
      }
    </style>
    <script>
      function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(
          function () {
            alert("Copied: " + text);
          },
          function (err) {
            alert("Could not copy text: " + err);
          }
        );
      }
    </script>
  </head>
  <body>
    <h1>Inventory</h1>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="name" placeholder="Name" required />
      <input type="text" name="description" placeholder="Description" />
      <input type="number" name="price" placeholder="Price" required />
      <input type="number" name="stock" placeholder="Stock" required />
      <button type="submit">Add Product</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for p in products %}
        <tr>
          <td>
            {{ p.id }}
            <button
              type="button"
              class="copy-btn"
              onclick="copyToClipboard('{{ p.id }}')"
            >
              Copy
            </button>
          </td>
          <td>{{ p.name }}</td>
          <td>{{ p.description }}</td>
          <td>{{ p.price }}</td>
          <td>{{ p.stock }}</td>
          <td>
            <a href="{% url 'edit_product' p.id %}">Edit</a>
            <form
              action="{% url 'delete_product' p.id %}"
              method="post"
              style="display: inline"
            >
              {% csrf_token %}
              <button
                type="submit"
                onclick="return confirm('Delete this product?');"
              >
                Delete
              </button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="6">No products</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
