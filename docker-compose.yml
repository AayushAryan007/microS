version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"

  user_service:
    build: ./user_service
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq

  order_service:
    build: ./order_service
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq

  inventory_service:
    build: ./inventory_service
    ports:
      - "8003:8003"
    depends_on:
      - rabbitmq
